[project]
name = "pdf2bpmn"
version = "0.1.0"
description = "PDF to BPMN converter with Neo4j knowledge graph and LangGraph HITL workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 취약점 보정 (2026-10-21) — **안 쓰는 우산을 안 깐다.**
    #
    # 코드가 실제로 import 하는 것은 `langchain_core` · `langchain_openai` ·
    # `langgraph` **셋뿐**이다(전수 확인: `langchain_community` 0건,
    # `langchain` 우산 자체도 0건). 그런데 우산 둘이 깔려 있어서
    # `langgraph` 를 못 올리고 있었다 — `langgraph>=1.2.16` 은
    # `langgraph-sdk>=0.4.6` 을 요구하는데(CVE-2026-104873 권한 오류가
    # 0.4.4 에서 고쳐졌다), 해결기가 `langchain-community` 의
    # **사전배포판**(1.0.0a1)을 요구해 매번 실패했다.
    # 우산 둘을 걷어내면 그 제약이 사라진다.
    "langgraph>=1.2.16",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "psycopg[binary]>=3.2.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0,<2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "uuid6>=2024.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    # file conversion / OCR / vision (optional at runtime but included for portability)
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24.0",
    "requests>=2.32.5",
    "process-gpt-agent-sdk>=0.4.15",
    # 취약점 보정 (2026-10-21 · robo-architect) — **litellm 을 직접 올린다.**
    #
    # ⚠ 10-20 에는 "SDK 가 litellm 을 묶어서 단독 상향이 안 된다" 고 적었는데
    #   **틀렸다**. `uv.lock` 을 보면 `process-gpt-agent-sdk 0.4.15` 의 litellm
    #   의존에는 **버전 제약이 아예 없다**(`{ name = "litellm" }`). 1.83.0 은
    #   잠글 당시의 최신이었을 뿐이다. SDK 를 건드리지 않고 litellm 만 올린다 —
    #   SDK 를 올릴 때 생기던 `a2a-sdk` 소실 문제는 여기서 일어나지 않는다.
    #
    # 걷히는 것 9건(치명 3) — 그중 **셋은 CISA KEV**(실제 악용 중):
    #   CVE-2026-42208 SQL 주입 · CVE-2026-59822 인증 우회 · CVE-2026-42271 명령 주입
    #   나머지: CVE-2026-37004 · CVE-2026-49468 · CVE-2026-47102 · CVE-2026-47101
    #           CVE-2026-42203 · CVE-2026-40217
    # 가장 늦게 고쳐진 것이 1.84.0(CVE-2026-49468)이라 바닥을 거기에 둔다.
    "litellm>=1.84.0",
    # ⚠ **langgraph-sdk 와 protobuf 는 여기서 못 올린다**(2026-10-21 실측).
    #   langgraph-sdk>=0.4.4  → `langchain-community` 가 **사전배포판**(1.0.0a1)을
    #                           요구해 해결 자체가 안 된다
    #   protobuf>=6.33.5      → 해결은 되는데 **SDK 가 0.4.15 → 0.11.0 으로 끌려가고
    #                           `sse-starlette` 가 빠진다** — 10-20 에 실측된 그대로
    #                           `a2a_server` 가 죽는 조합이다. 상류 일이다
    "supabase>=2.28.3",
]

# Streamlit UI is **optional** (2026-10-20 · robo-architect vuln patch).
#
# The container entrypoint runs `run.py api` + `a2a_server.py`; Streamlit is only
# reached through `run.py ui`, which launches it in a subprocess. Keeping it in
# the required set pulled **GitPython** and **Tornado** into every image:
#
#     gitpython 3.1.45  1 critical + 32 high
#     tornado   6.5.3   7 high
#     pyarrow   22.0.0  1 high
#
# That is **41 of the image's 153 critical/high findings** for code the image
# never executes. Install with `pip install .[ui]` (or `uv sync --extra ui`)
# when you want the Streamlit UI.
[project.optional-dependencies]
ui = [
    "streamlit>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

